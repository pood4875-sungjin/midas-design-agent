<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Component — Button</title>
  <link rel="stylesheet" href="button.css?v=2" />
  <style>
    body { margin: 0; padding: 28px; background: #fff; font-family: var(--font-sans); }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .lbl { width: 80px; font-size: 12px; color: #878a93; flex: none; }
  </style>
</head>
<body>
  <div id="demo"></div>
  <script>
    var PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    // 소스 축 그대로
    var styles = [["primary","Primary"],["filled","Filled"],["outline","Outline"],["clear","Clear"]];
    var sizes = [["xs","XS-24"],["s","S-32"],["m","M-40"],["ml","ML-44"],["l","L-48"],["xl","XL-56"]];
    var d = document.getElementById("demo");
    styles.forEach(function (s) {
      var h = '<div class="row"><span class="lbl">' + s[1] + '</span>';
      sizes.forEach(function (z) {
        h += '<button class="btn btn--' + s[0] + ' btn--' + z[0] + '">' + PLUS + '버튼' + PLUS + '</button>';
      });
      h += '<button class="btn btn--' + s[0] + ' btn--m is-disabled">버튼</button>';
      d.innerHTML += h + '</div>';
    });
    var h2 = '<div class="row" style="margin-top:24px"><span class="lbl">Icon · State</span>';
    styles.forEach(function (s) { h2 += '<button class="btn btn--' + s[0] + ' btn--m btn--icon">' + PLUS + '</button>'; });
    h2 += '<button class="btn btn--filled btn--m">Focus(Tab)</button>';
    h2 += '<button class="btn btn--filled btn--m is-disabled">Disabled</button></div>';
    d.innerHTML += h2;
  </script>
</body>
</html>
