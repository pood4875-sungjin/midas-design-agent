<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDA Control Tower — 현황판</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body data-page="overview">
  <header class="hd">
    <div class="hd__l">
      <h1 id="p-title">MIDAS Design Agent</h1>
      <p id="p-sub">—</p>
    </div>
    <div class="hd__r">
      <div class="hd__now"><span class="pulse"></span><span id="p-now">—</span></div>
      <div id="p-updated">—</div>
    </div>
  </header>

  <section class="card full" style="margin-bottom:24px">
    <div class="card__t">파이프라인</div>
    <div class="pipe" id="pipe"></div>
  </section>

  <div class="grid">
    <div class="col">
      <section class="card">
        <div class="card__t">로드맵</div>
        <div class="rm" id="rm"></div>
      </section>
      <section class="card">
        <div class="card__t">토큰 추출 현황</div>
        <div class="tok" id="tok"></div>
      </section>
    </div>
    <div class="col">
      <section class="card">
        <div class="card__t">Phase 0 체크리스트</div>
        <div class="ck" id="ck"></div>
      </section>
      <section class="card">
        <div class="card__t">Audit — 원본 vs 재생성</div>
        <div id="audit"></div>
      </section>
    </div>
  </div>

  <section class="card full" style="margin-top:24px">
    <div class="card__t">활동 로그 (실시간)</div>
    <div class="log" id="log"></div>
  </section>

  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
