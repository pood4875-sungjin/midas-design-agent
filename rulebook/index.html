<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온사이트 생성 정책 rulebook</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css");
    @import url("../onsite-designsystem/tokens/tokens.css?v=4");
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); color: var(--color-label-neutral);
      background: var(--color-bg-subtle); display: flex; min-height: 100vh; }

    /* SNB */
    .snb { width: 260px; flex: none; background: var(--color-surface); border-right: 1px solid var(--color-line);
      padding: var(--space-6) var(--space-4); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .snb__brand { font-size: var(--fs-heading-3); font-weight: var(--fw-bold); color: var(--color-label-strong);
      letter-spacing: var(--ls-tight); margin: 0 0 4px; }
    .snb__sub { font-size: var(--fs-caption-1); color: var(--color-label-assistive); margin: 0 0 var(--space-6); }
    .snb__grp { font-size: var(--fs-caption-1); font-weight: var(--fw-bold); color: var(--color-label-assistive);
      text-transform: uppercase; letter-spacing: .04em; margin: var(--space-5) 0 var(--space-2); }
    .snb a { display: block; padding: 7px var(--space-3); border-radius: var(--radius-2xs);
      font-size: var(--fs-label-1); color: var(--color-label-neutral); text-decoration: none; cursor: pointer; }
    .snb a:hover { background: var(--color-bg-subtle); }
    .snb a.is-active { background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--fw-semibold); }
    .snb a.ext::after { content: "↗"; float: right; color: var(--color-label-assistive); }
    .snb a.is-active.ext::after { color: var(--color-on-primary); }

    /* main */
    .main { flex: 1; min-width: 0; padding: var(--space-10) var(--space-12); max-width: 900px; }
    .doc { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg);
      padding: var(--space-10); box-shadow: var(--shadow-card); }
    .frame-wrap { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg);
      overflow: hidden; box-shadow: var(--shadow-card); }
    .frame-wrap iframe { width: 100%; height: 82vh; border: 0; display: block; background: var(--color-bg-subtle); }
    .frame-bar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--color-line-subtle); }
    .frame-bar b { font-size: var(--fs-label-1); color: var(--color-label-strong); }
    .frame-bar a { font-size: var(--fs-caption-1); color: var(--color-primary); text-decoration: none; margin-left: auto; }

    /* markdown */
    .doc h1 { font-size: var(--fs-title-3); color: var(--color-label-strong); letter-spacing: var(--ls-title-3);
      margin: 0 0 var(--space-4); }
    .doc h2 { font-size: var(--fs-heading-2); color: var(--color-label-strong); letter-spacing: var(--ls-heading);
      margin: var(--space-8) 0 var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--color-line-subtle); }
    .doc h3 { font-size: var(--fs-body-1); color: var(--color-label-strong); margin: var(--space-6) 0 var(--space-2); }
    .doc p, .doc li { font-size: var(--fs-body-2); line-height: var(--lh-reading); }
    .doc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
      background: var(--color-bg-muted); padding: 1px 5px; border-radius: var(--radius-3xs); color: var(--color-danger); }
    .doc pre { background: var(--p-bluegray-20); color: #e5e7eb; padding: var(--space-4); border-radius: var(--radius-xs);
      overflow-x: auto; }
    .doc pre code { background: none; color: inherit; padding: 0; }
    .doc table { border-collapse: collapse; width: 100%; margin: var(--space-3) 0; font-size: var(--fs-label-1); }
    .doc th, .doc td { border: 1px solid var(--color-line); padding: 8px 10px; text-align: left; vertical-align: top; }
    .doc th { background: var(--color-bg-muted); font-weight: var(--fw-semibold); color: var(--color-label-strong); }
    .doc a { color: var(--color-primary); }
    .doc blockquote { border-left: 3px solid var(--color-primary); margin: var(--space-3) 0;
      padding: 2px var(--space-4); color: var(--color-label-alternative); background: var(--color-bg-subtle); }
  </style>
</head>
<body>
  <nav class="snb">
    <p class="snb__brand">생성 정책 rulebook</p>
    <p class="snb__sub">온사이트 · PRD/시안 → 화면</p>

    <div class="snb__grp">개요</div>
    <a data-md="README.md" class="is-active">README (커널·게이트)</a>

    <div class="snb__grp">규칙 (노드별)</div>
    <a data-md="rules/1-ia.md">1 · IA / 아키타입</a>
    <a data-md="rules/2-layout.md">2 · 레이아웃 / 진입형태</a>
    <a data-md="rules/3-ux-axes.md">3 · UX 결정축 (7)</a>
    <a data-md="rules/4-components.md">4 · 컴포넌트 / 권한</a>
    <a data-md="rules/5-tokens.md">5 · 토큰 / 상태</a>
    <a data-md="rules/6-audit.md">6 · Audit</a>

    <div class="snb__grp">패턴 카탈로그</div>
    <a data-md="patterns/data-representation.md">데이터표현 (8종)</a>
    <a data-md="patterns/overlays.md">오버레이 · 모달 (5종)</a>

    <div class="snb__grp">실전 화면 (검증)</div>
    <a data-screen="../screens/member-management.html" class="ext">멤버 관리 (드로어)</a>
    <a data-screen="../screens/member-invite-modal.html" class="ext">멤버 초대 (모달)</a>
  </nav>

  <main class="main">
    <div class="doc" id="doc">로딩…</div>
    <div class="frame-wrap" id="frameWrap" style="display:none">
      <div class="frame-bar"><b id="frameTitle"></b><a id="frameOpen" target="_blank">새 탭에서 열기 ↗</a></div>
      <iframe id="frame" title="screen"></iframe>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const doc = document.getElementById('doc');
    const frameWrap = document.getElementById('frameWrap');
    const frame = document.getElementById('frame');
    const links = [...document.querySelectorAll('.snb a')];

    function activate(el){ links.forEach(a => a.classList.toggle('is-active', a === el)); }

    async function loadMd(path, el){
      activate(el); frameWrap.style.display = 'none'; doc.style.display = '';
      doc.textContent = '로딩…';
      try {
        const res = await fetch(path + '?t=' + Date.now());
        if (!res.ok) throw new Error(res.status);
        let md = await res.text();
        // .md 내부 상대링크는 뷰어 내비로 치환 (docs/ 링크는 그대로 새탭)
        doc.innerHTML = marked.parse(md);
        doc.querySelectorAll('a[href$=".md"]').forEach(a => {
          const href = a.getAttribute('href');
          if (href.startsWith('../docs/')) { a.target = '_blank'; return; }
          a.addEventListener('click', e => {
            e.preventDefault();
            const clean = href.replace(/^\.\//,'').replace(/^\.\.\//,'');
            const match = links.find(l => l.dataset.md && l.dataset.md.endsWith(clean.split('/').pop()));
            if (match) match.click();
          });
        });
        doc.scrollIntoView({block:'start'});
      } catch(e){ doc.textContent = '불러오기 실패: ' + path + ' (' + e.message + ')'; }
    }

    function loadScreen(path, el){
      activate(el); doc.style.display = 'none'; frameWrap.style.display = '';
      document.getElementById('frameTitle').textContent = el.textContent;
      document.getElementById('frameOpen').href = path;
      frame.src = path;
    }

    links.forEach(a => a.addEventListener('click', () => {
      if (a.dataset.md) loadMd(a.dataset.md, a);
      else if (a.dataset.screen) loadScreen(a.dataset.screen, a);
    }));

    loadMd('README.md', links[0]);
  </script>
</body>
</html>
